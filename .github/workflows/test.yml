name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run typecheck

      - run: npm test

      # Real Pi process with an offline scripted provider (no API keys needed).
      - run: npm run test:e2e
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
